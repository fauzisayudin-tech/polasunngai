<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Interaktif Pola Aliran Sungai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .river-path {
            stroke: #2563eb;
            stroke-width: 3;
            stroke-linecap: round;
            fill: none;
            transition: all 0.5s ease;
        }
        .river-path-main {
            stroke-width: 5;
        }
        .mountain {
            fill: #94a3b8;
        }
        .basin {
            fill: #cbd5e1;
        }
        .card-active {
            border: 2px solid #2563eb;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2">Pola Aliran Sungai</h1>
            <p class="text-slate-600">Pelajari berbagai bentuk pola aliran sungai berdasarkan kondisi geologi dan topografi.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sidebar: List of Patterns -->
            <div class="lg:col-span-1 space-y-3 max-h-[600px] overflow-y-auto pr-2" id="pattern-list">
                <!-- List items will be generated by JS -->
            </div>

            <!-- Main Content: Visualization and Info -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center">
                <div id="visual-container" class="w-full aspect-video bg-blue-50 rounded-xl mb-6 border border-blue-100 flex items-center justify-center relative overflow-hidden">
                    <svg id="river-svg" viewBox="0 0 400 300" class="w-full h-full">
                        <!-- SVG content dynamically injected -->
                    </svg>
                </div>
                
                <div id="info-content" class="w-full">
                    <h2 id="pattern-name" class="text-2xl font-bold text-blue-700 mb-2">Pilih Pola</h2>
                    <p id="pattern-description" class="text-slate-700 leading-relaxed">Klik salah satu pola di samping untuk melihat visualisasi dan penjelasannya.</p>
                    
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Karakteristik Geologi</span>
                            <span id="geo-info" class="text-sm text-slate-700">-</span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Contoh Lokasi</span>
                            <span id="loc-info" class="text-sm text-slate-700">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="mt-12 text-center text-slate-400 text-sm">
            &copy; 2024 Media Pembelajaran Geografi - Pola Aliran Sungai
        </footer>
    </div>

    <script>
        const patterns = [
            {
                id: 'dendritik',
                name: 'Pola Dendritik',
                desc: 'Pola aliran yang menyerupai cabang pohon. Percabangannya tidak teratur dan biasanya membentuk sudut lancip.',
                geology: 'Batuan homogen, lereng landai, atau dataran rendah.',
                location: 'Cekungan Amazon, Sungai Mississippi.',
                svg: `
                    <path class="river-path river-path-main" d="M200,300 Q200,200 200,150" />
                    <path class="river-path" d="M200,220 Q250,180 280,120" />
                    <path class="river-path" d="M200,180 Q150,140 120,80" />
                    <path class="river-path" d="M280,120 Q320,100 340,60" />
                    <path class="river-path" d="M250,150 Q280,140 300,100" />
                    <path class="river-path" d="M150,120 Q120,110 100,60" />
                `
            },
            {
                id: 'trelis',
                name: 'Pola Trelis',
                desc: 'Pola aliran di mana anak-anak sungai sejajar satu sama lain dan bermuara pada sungai utama dengan sudut tegak lurus.',
                geology: 'Daerah lipatan (antiklin dan sinklin).',
                location: 'Pegunungan Appalachian, Pegunungan Kendeng.',
                svg: `
                    <path class="river-path river-path-main" d="M200,300 L200,50" />
                    <path class="river-path" d="M100,100 L200,100" />
                    <path class="river-path" d="M100,180 L200,180" />
                    <path class="river-path" d="M300,140 L200,140" />
                    <path class="river-path" d="M300,220 L200,220" />
                    <path class="river-path" d="M100,80 L100,250" stroke-dasharray="5,5" opacity="0.3"/>
                    <path class="river-path" d="M300,80 L300,250" stroke-dasharray="5,5" opacity="0.3"/>
                `
            },
            {
                id: 'rektangular',
                name: 'Pola Rektangular',
                desc: 'Pola aliran yang dikontrol oleh patahan atau rekahan. Aliran air mengikuti retakan batuan dan berbelok dengan sudut siku-siku.',
                geology: 'Wilayah yang memiliki banyak patahan (sesar) atau kekar.',
                location: 'Sungai Colorado, Daerah Karst.',
                svg: `
                    <path class="river-path river-path-main" d="M200,300 L200,220 L300,220 L300,150 L100,150 L100,80 L250,80" />
                    <path class="river-path" d="M200,220 L120,220 L120,260" />
                    <path class="river-path" d="M100,150 L100,180" />
                `
            },
            {
                id: 'paralel',
                name: 'Pola Paralel',
                desc: 'Pola aliran sungai yang arahnya hampir sejajar satu sama lain, biasanya ditemukan di lereng yang panjang dan curam.',
                geology: 'Lereng curam dan memanjang.',
                location: 'Pantai Barat Amerika Selatan (Andes).',
                svg: `
                    <path class="river-path" d="M100,50 Q120,150 140,250" />
                    <path class="river-path" d="M180,40 Q200,140 220,240" />
                    <path class="river-path" d="M260,50 Q280,150 300,250" />
                `
            },
            {
                id: 'radial_sentrifugal',
                name: 'Pola Radial Sentrifugal',
                desc: 'Aliran sungai yang memancar keluar dari satu pusat (puncak). Aliran menyebar ke segala arah.',
                geology: 'Gunung berbentuk kerucut (gunung api) atau kubah (dome).',
                location: 'Gunung Merapi, Gunung Slamet.',
                svg: `
                    <circle cx="200" cy="150" r="10" fill="#f87171" />
                    <path class="river-path" d="M200,140 L200,40" />
                    <path class="river-path" d="M200,160 L200,260" />
                    <path class="river-path" d="M190,150 L90,150" />
                    <path class="river-path" d="M210,150 L310,150" />
                    <path class="river-path" d="M193,143 L120,70" />
                    <path class="river-path" d="M207,157 L280,230" />
                `
            },
            {
                id: 'radial_sentripetal',
                name: 'Pola Radial Sentripetal',
                desc: 'Aliran sungai yang mengalir menuju ke satu pusat atau titik terendah (cekungan).',
                geology: 'Cekungan (basinal), kawah, atau danau.',
                location: 'Cekungan Danau Chad, Danau Titicaca.',
                svg: `
                    <circle cx="200" cy="150" r="20" fill="#60a5fa" />
                    <path class="river-path" d="M200,40 L200,130" />
                    <path class="river-path" d="M200,260 L200,170" />
                    <path class="river-path" d="M90,150 L180,150" />
                    <path class="river-path" d="M310,150 L220,150" />
                    <path class="river-path" d="M120,70 L186,136" />
                    <path class="river-path" d="M280,230 L214,164" />
                `
            },
            {
                id: 'anular',
                name: 'Pola Anular',
                desc: 'Aliran sungai yang melingkar mengikuti struktur batuan yang berbentuk kubah yang tererosi.',
                geology: 'Kubah (dome) yang telah mengalami pengikatan lanjut.',
                location: 'Black Hills di South Dakota.',
                svg: `
                    <circle cx="200" cy="150" r="5" fill="#94a3b8" />
                    <path class="river-path" d="M200,80 A70,70 0 1,1 199,80" />
                    <path class="river-path" d="M200,50 A100,100 0 0,1 300,150" />
                    <path class="river-path" d="M200,150 L200,250" class="river-path-main"/>
                `
            },
            {
                id: 'pinnate',
                name: 'Pola Pinnate',
                desc: 'Pola di mana anak sungai membentuk sudut yang sangat tajam (hampir sejajar) terhadap sungai utama.',
                geology: 'Lereng curam yang sangat tererosi.',
                location: 'Daerah dataran tinggi dengan kemiringan ekstrem.',
                svg: `
                    <path class="river-path river-path-main" d="M200,300 L200,50" />
                    <path class="river-path" d="M200,250 L150,210" />
                    <path class="river-path" d="M200,200 L150,160" />
                    <path class="river-path" d="M200,150 L150,110" />
                    <path class="river-path" d="M200,230 L250,190" />
                    <path class="river-path" d="M200,180 L250,140" />
                    <path class="river-path" d="M200,130 L250,90" />
                `
            }
        ];

        const listContainer = document.getElementById('pattern-list');
        const svgContainer = document.getElementById('river-svg');
        const pName = document.getElementById('pattern-name');
        const pDesc = document.getElementById('pattern-description');
        const geoInfo = document.getElementById('geo-info');
        const locInfo = document.getElementById('loc-info');

        function selectPattern(id) {
            const pattern = patterns.find(p => p.id === id);
            if (!pattern) return;

            // Update UI list state
            document.querySelectorAll('.pattern-card').forEach(card => {
                card.classList.remove('card-active', 'shadow-md');
            });
            document.getElementById(`card-${id}`).classList.add('card-active', 'shadow-md');

            // Update content with animation
            svgContainer.style.opacity = 0;
            setTimeout(() => {
                svgContainer.innerHTML = pattern.svg;
                svgContainer.style.opacity = 1;
                pName.innerText = pattern.name;
                pDesc.innerText = pattern.desc;
                geoInfo.innerText = pattern.geology;
                locInfo.innerText = pattern.location;
            }, 200);
        }

        // Initialize List
        patterns.forEach(p => {
            const div = document.createElement('div');
            div.id = `card-${p.id}`;
            div.className = 'pattern-card bg-white p-4 rounded-xl border border-slate-200 cursor-pointer hover:border-blue-300 transition-all';
            div.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                    <span class="font-semibold text-slate-700">${p.name}</span>
                </div>
            `;
            div.onclick = () => selectPattern(p.id);
            listContainer.appendChild(div);
        });

        // Set Default
        selectPattern('dendritik');
    </script>
</body>
</html>
